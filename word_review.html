<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تمييز الكلمات — الدلائل والهمزية</title>
<style>
:root{--bg:#F7F3E9;--card:#FFFDF8;--ink:#1F2A24;--muted:#6D7468;--em:#0F5A41;--gold:#B8914A;--wash:#EFD98F;--rule:#E4DCCB}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Amiri","Geeza Pro",serif}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--rule);padding:12px 16px 10px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:20px;margin:0 0 8px;color:var(--em)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 14px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--em);color:#fff}
audio{width:100%;margin-top:8px}
.hint{font-family:system-ui,sans-serif;font-size:12.5px;color:var(--muted);margin:6px 0 0}
main{padding:8px 16px 60vh}
.line{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:24px;line-height:2.15}
.line.cur{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,145,74,.25)}
.tag{font-family:system-ui,sans-serif;font-size:11px;color:var(--muted);margin-inline-end:8px}
.rep{font-family:system-ui,sans-serif;font-size:11px;font-weight:700;color:var(--gold);margin-inline-start:6px}
.w{border-radius:6px;padding:0 2px;cursor:pointer}
.w.on{background:var(--wash)}
.w.none{opacity:.4}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style></head><body>
<div class="bar"><div class="wrap">
  <h1>تمييز الكلمات</h1>
  <div class="row">
    <div class="seg" id="rec"></div>
    <div class="seg" id="tim"><button data-t="new" class="on">الجديد (CTC)</button><button data-t="old">القديم (Whisper)</button></div>
  </div>
  <audio id="a" controls preload="metadata"></audio>
  <p class="hint" id="hint"></p>
</div></div>
<main><div class="wrap" id="text"></div></main>
<script src="word_review_data.js"></script>
<script>
const a=document.getElementById('a'), textEl=document.getElementById('text'), hint=document.getElementById('hint');
let rec=Object.keys(DATA)[0], timing='new', words=[], lineEls=[], lastW=-1, lastL=-1;
const recEl=document.getElementById('rec');
Object.entries(DATA).forEach(([k,v])=>{const b=document.createElement('button'); b.textContent=v.title; b.dataset.r=k; if(k===rec) b.className='on'; recEl.appendChild(b);});
function build(){
  const R=DATA[rec]; textEl.innerHTML=''; words=[]; lineEls=[]; lastW=-1; lastL=-1;
  R.lines.forEach((ln,li)=>{
    const d=document.createElement('div'); d.className='line';
    const tag=document.createElement('span'); tag.className='tag'; tag.textContent='v'+String(ln.v).padStart(3,'0'); d.appendChild(tag);
    const spans=ln.w.map((w,wi)=>{
      const s=document.createElement('span'); s.className='w'; s.textContent=w;
      d.appendChild(s); d.appendChild(document.createTextNode(' ')); return s;});
    if(ln.new.length>1){const r=document.createElement('span'); r.className='rep'; r.textContent='×'+ln.new.length; d.appendChild(r);}
    const sets = timing==='new' ? ln.new : [ln.old];
    spans.forEach((s,wi)=>{
      const ts=sets.map(p=>p[wi]).filter(t=>t!=null);
      if(!ts.length){ s.classList.add('none'); return; }
      s.onclick=()=>{a.currentTime=ts[0]; a.play();};
      ts.forEach(t=>words.push({t:t*1000,s,li}));
    });
    textEl.appendChild(d); lineEls.push(d);
  });
  words.sort((x,y)=>x.t-y.t);
  if(a.dataset.src!==R.audio){a.src=R.audio; a.dataset.src=R.audio;}
  hint.textContent = timing==='new'
    ? 'اضغطوا أيَّ كلمة للانتقال إليها. «×2» علامةُ بيتٍ أو سطرٍ أُنشد مرّتين: يُضاء في كلِّ مرّة.'
    : 'التوقيت القديم: كلماتُ Whisper المطابَقة فقط؛ الكلماتُ الباهتة لم يجد لها المطابِقُ القديم وقتًا.';
}
recEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{recEl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); rec=b.dataset.r; build();});
document.querySelectorAll('#tim button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tim button').forEach(x=>x.classList.toggle('on',x===b)); timing=b.dataset.t; build();});
function tick(){
  if(!a.paused && words.length){
    const ms=a.currentTime*1000; let lo=0, hi=words.length-1, k=-1;
    while(lo<=hi){const m=(lo+hi)>>1; if(words[m].t<=ms){k=m; lo=m+1;} else hi=m-1;}
    if(k!==lastW){
      if(lastW>=0) words[lastW].s.classList.remove('on');
      if(k>=0){ words[k].s.classList.add('on'); const li=words[k].li;
        if(li!==lastL){ if(lastL>=0) lineEls[lastL].classList.remove('cur'); lineEls[li].classList.add('cur'); lineEls[li].scrollIntoView({block:'center',behavior:'smooth'}); lastL=li; } }
      lastW=k;
    }
  }
  requestAnimationFrame(tick);
}
build(); requestAnimationFrame(tick);
</script></body></html>
